<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="100%" height="100%" role="img" aria-label="SchoolMeritPoints Mobile Screens Preview">
  <defs>
    <filter id="phoneShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1100" height="430" rx="20" fill="#eef2fa"/>

  <!-- Screen 1: Student View -->
  <g transform="translate(45, 28)" filter="url(#phoneShadow)">
    <rect width="300" height="374" rx="26" fill="#f5f7fb" stroke="#14213d" stroke-width="4"/>
    <rect x="0" y="0" width="300" height="46" rx="22" fill="#ffffff"/>
    <text x="276" y="29" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#14213d">🎓 מסך תלמיד — נועם כהן</text>

    <rect x="16" y="58" width="268" height="92" rx="14" fill="#1f4fa3"/>
    <text x="268" y="80" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#d9e5ff">הנקודות שלי</text>
    <text x="268" y="116" text-anchor="end" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#f2b705">10</text>
    <rect x="32" y="128" width="236" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="110" y="128" width="158" height="6" rx="3" fill="#f2b705"/>

    <rect x="16" y="160" width="129" height="48" rx="10" fill="#ffffff" stroke="#dde3ef"/>
    <text x="132" y="178" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#5b6782">מקום הכיתה</text>
    <text x="132" y="198" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#14213d">1 מתוך 3</text>

    <rect x="155" y="160" width="129" height="48" rx="10" fill="#ffffff" stroke="#dde3ef"/>
    <text x="271" y="178" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#5b6782">הכיתה שלי</text>
    <text x="271" y="198" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#1f4fa3">ו'1</text>

    <rect x="16" y="218" width="268" height="102" rx="12" fill="#ffffff" stroke="#dde3ef"/>
    <text x="270" y="240" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#14213d">התנהגות בדרך ארץ</text>
    <rect x="28" y="226" width="38" height="20" rx="6" fill="#dcf3e8"/>
    <text x="47" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#1c8c5e">+5</text>

    <line x1="28" y1="258" x2="270" y2="258" stroke="#dde3ef"/>
    <text x="270" y="280" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#14213d">הגעה בזמן</text>
    <rect x="28" y="266" width="38" height="20" rx="6" fill="#dcf3e8"/>
    <text x="47" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#1c8c5e">+3</text>

    <rect x="4" y="330" width="292" height="40" rx="18" fill="#ffffff"/>
    <text x="150" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#1f4fa3">🏠 בית   ·   👥 הכיתה   ·   🏆 דירוג   ·   📋 היסטוריה</text>
  </g>

  <!-- Screen 2: Teacher Batch Scoring -->
  <g transform="translate(400, 28)" filter="url(#phoneShadow)">
    <rect width="300" height="374" rx="26" fill="#f5f7fb" stroke="#14213d" stroke-width="4"/>
    <rect x="0" y="0" width="300" height="46" rx="22" fill="#ffffff"/>
    <text x="276" y="29" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#14213d">👨‍🏫 מסך מורה — מתן נקודות</text>

    <!-- Class selector -->
    <rect x="16" y="56" width="268" height="34" rx="10" fill="#ffffff" stroke="#1f4fa3" stroke-width="1.5"/>
    <text x="268" y="78" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#14213d">כיתה ו'1 (4 תלמידים) ▾</text>

    <!-- Chips -->
    <rect x="190" y="100" width="94" height="28" rx="14" fill="#fff5d1" stroke="#f2b705" stroke-width="1.5"/>
    <text x="237" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#14213d">הגעה בזמן</text>

    <rect x="96" y="100" width="86" height="28" rx="14" fill="#ffffff" stroke="#dde3ef"/>
    <text x="139" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#5b6782">תלבושת</text>

    <rect x="16" y="100" width="72" height="28" rx="14" fill="#ffffff" stroke="#dde3ef"/>
    <text x="52" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#5b6782">ציצית</text>

    <!-- Multi-select students -->
    <rect x="16" y="138" width="268" height="126" rx="12" fill="#ffffff" stroke="#dde3ef"/>
    <rect x="252" y="152" width="18" height="18" rx="5" fill="#1f4fa3"/>
    <text x="261" y="165" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>
    <text x="240" y="166" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#14213d">נועם כהן</text>

    <rect x="252" y="186" width="18" height="18" rx="5" fill="#1f4fa3"/>
    <text x="261" y="199" text-anchor="middle" font-size="12" fill="#ffffff">✓</text>
    <text x="240" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#14213d">אורי לוי</text>

    <rect x="252" y="220" width="18" height="18" rx="5" fill="#ffffff" stroke="#dde3ef" stroke-width="2"/>
    <text x="240" y="234" text-anchor="end" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#5b6782">איתי מזרחי</text>

    <!-- Action buttons -->
    <rect x="154" y="274" width="130" height="44" rx="12" fill="#dcf3e8"/>
    <text x="219" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#1c8c5e">✔ הענק נקודות</text>

    <rect x="16" y="274" width="130" height="44" rx="12" fill="#fbe3de"/>
    <text x="81" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#c8452f">✔ הורד נקודות</text>

    <rect x="4" y="330" width="292" height="40" rx="18" fill="#ffffff"/>
    <text x="150" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#1f4fa3">⭐ מתן נקודות   ·   🏆 דירוג   ·   📋 היסטוריה</text>
  </g>

  <!-- Screen 3: Rankings & Admin -->
  <g transform="translate(755, 28)" filter="url(#phoneShadow)">
    <rect width="300" height="374" rx="26" fill="#151f38" stroke="#14213d" stroke-width="4"/>
    <rect x="0" y="0" width="300" height="46" rx="22" fill="#0d1426"/>
    <text x="276" y="29" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#e8edf8">🏆 דירוג כיתות (Dark Mode)</text>

    <rect x="16" y="60" width="268" height="200" rx="14" fill="#0d1426" stroke="#27345a"/>

    <!-- Rank 1 -->
    <circle cx="262" cy="94" r="13" fill="#f6c93b"/>
    <text x="262" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#14213d">1</text>
    <text x="238" y="99" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e8edf8">ו'1</text>
    <rect x="64" y="89" width="142" height="10" rx="5" fill="#1d2c52"/>
    <rect x="64" y="89" width="142" height="10" rx="5" fill="#7ea6f0"/>
    <text x="48" y="99" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#f6c93b">17</text>

    <!-- Rank 2 -->
    <circle cx="262" cy="144" r="13" fill="#f6c93b"/>
    <text x="262" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#14213d">2</text>
    <text x="238" y="149" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e8edf8">ו'2</text>
    <rect x="64" y="139" width="142" height="10" rx="5" fill="#1d2c52"/>
    <rect x="122" y="139" width="84" height="10" rx="5" fill="#7ea6f0"/>
    <text x="48" y="149" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#e8edf8">6</text>

    <!-- Rank 3 -->
    <circle cx="262" cy="194" r="13" fill="#f6c93b"/>
    <text x="262" y="199" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#14213d">3</text>
    <text x="238" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e8edf8">ז'1</text>
    <rect x="64" y="189" width="142" height="10" rx="5" fill="#1d2c52"/>
    <rect x="166" y="189" width="40" height="10" rx="5" fill="#7ea6f0"/>
    <text x="48" y="199" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#e8edf8">2</text>

    <!-- CSV Export Button -->
    <rect x="16" y="274" width="268" height="44" rx="12" fill="#7ea6f0"/>
    <text x="150" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#0d1426">📥 ייצא לאקסל (CSV)</text>

    <rect x="4" y="330" width="292" height="40" rx="18" fill="#0d1426"/>
    <text x="150" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#7ea6f0">👥 משתמשים · 🏫 כיתות · 📋 קריטריונים · 📥 ייצוא</text>
  </g>
</svg>
