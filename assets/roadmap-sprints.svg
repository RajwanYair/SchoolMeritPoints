<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%" role="img" aria-label="SchoolMeritPoints 6-Sprint Open-Source Development Roadmap">
  <defs>
    <linearGradient id="rmHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2557"/>
      <stop offset="100%" stop-color="#1f4fa3"/>
    </linearGradient>
    <filter id="rmShadow" x="-5%" y="-5%" width="110%" height="115%">
