  <text x="580" y="53" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="800" font-size="21" fill="#ffffff">
    🗺️ SchoolMeritPoints — Agile Sprint Roadmap (Open-Source Community Edition)
  </text>

  <!-- Row 1: Sprints 1, 2, 3 -->
  <!-- Sprint 1 -->
  <g transform="translate(24, 94)" filter="url(#rmShadow)">
