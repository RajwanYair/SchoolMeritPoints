    <text x="18" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🔄 Period Rollover (Reset Leaderboard, Keep Audit)</text>
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🛡️ Non-Negative Score Floor (`min_score = 0`) Knob</text>
    <text x="18" y="158" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🏫 Optional Teacher Homeroom-Only Scope Toggle</text>
  </g>

