    <text x="18" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 📜 Auto-Generated Printable Excellence Certificates</text>
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• ✨ Star-Burst Animation on Student Point Award</text>
    <text x="18" y="158" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🔔 Live Polling / SSE Auto-Refresh (&lt;60s sync)</text>
  </g>

