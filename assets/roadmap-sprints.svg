    <text x="338" y="26" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#1f4fa3">SMP-501..504</text>
    <text x="18" y="66" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#14213d">🛍️ Merit Prize Store &amp; Analytics</text>
    <text x="18" y="92" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🎁 School Prize Catalog &amp; Point Redemption Flow</text>
    <text x="18" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 💳 Separate Spendable Balance vs. Lifetime Score</text>
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 📊 Principal &amp; Homeroom Analytics Charts</text>
    <text x="18" y="158" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🏅 Campaign Tracker (Special Study / Chesed)</text>
  </g>

  <!-- Sprint 6 -->
  <g transform="translate(780, 306)" filter="url(#rmShadow)">
    <rect width="356" height="190" rx="16" fill="#ffffff" stroke="#c5d7fa" stroke-width="2"/>
    <rect width="356" height="40" rx="16" fill="#e6eefc"/>
    <text x="18" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#1f4fa3">👨‍👩‍👧 SPRINT 6 · v2.1 (PLANNED)</text>
    <text x="338" y="26" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#1f4fa3">SMP-601..604</text>
    <text x="18" y="66" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#14213d">💌 Parent View &amp; Weekly Digests</text>
    <text x="18" y="92" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 👀 Read-Only Parent Link / Token Access</text>
    <text x="18" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 📬 Automated Weekly Positive Digest Summary</text>
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🔔 Web Push Notifications for Student Milestones</text>
    <text x="18" y="158" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• ♿ Full WCAG / IS 5568 AA Accessibility Audit</text>
