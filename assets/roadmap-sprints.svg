    <rect width="356" height="40" rx="16" fill="#dcf3e8"/>
    <text x="18" y="26" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#1c8c5e">✅ SPRINT 1 · v1.0 (COMPLETED)</text>
    <text x="338" y="26" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#1c8c5e">SMP-101..106</text>
    <text x="18" y="66" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#14213d">🚀 Core PWA, RBAC &amp; Dual Runtime</text>
    <text x="18" y="92" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🎓👨‍🏫🛡️ 3-Tier RBAC (Student, Teacher, Admin)</text>
    <text x="18" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• ⚖️ 11 Criteria + Fair Normalized Class Score</text>
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🌐 Bilingual (EN/HE) + 🌓 Dark/Light + PC/Mobile</text>
    <text x="18" y="158" font-family="system-ui, sans-serif" font-size="12.5" fill="#5b6782">• 🧪 21-Test Automated Suite + GitHub Pages Live</text>
  </g>

