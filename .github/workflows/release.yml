name: Release Package & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to package/verify (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full quality gate before packaging
        run: |
          python -m py_compile server.py
          python -m unittest discover -s tests -v

      - name: Build release bundle
        id: bundle
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          PKG="SchoolMeritPoints-${TAG}"
          mkdir -p "dist/${PKG}"
          cp server.py index.html spec.html manifest.webmanifest icon.svg README.md spec.md ROADMAP.md CONTRIBUTING.md SECURITY.md LICENSE "dist/${PKG}/"
          cp -r assets "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          (cd dist && zip -qr "${PKG}.zip" "${PKG}")
          sha256sum "dist/${PKG}.tar.gz" "dist/${PKG}.zip" > "dist/${PKG}.sha256"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "### 📦 Release Package Built: \`${PKG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat "dist/${PKG}.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets to GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.bundle.outputs.tag }}"
          PKG="${{ steps.bundle.outputs.pkg }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/${PKG}.tar.gz" "dist/${PKG}.zip" "dist/${PKG}.sha256" --clobber
          else
            gh release create "${TAG}" "dist/${PKG}.tar.gz" "dist/${PKG}.zip" "dist/${PKG}.sha256" \
              --target "${{ github.sha }}" \
              --title "${TAG} — SchoolMeritPoints" \
              --generate-notes
          fi
